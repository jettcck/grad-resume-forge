name: Build

# 构建校验：不发布，验证 Windows/Linux 产物。
# 用途：1) 发版前确认打包配置没坏  2) PR 上先发现构建问题，别等到 tag 才发现
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建哪些平台'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, linux]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            label: windows
          - os: ubuntu-latest
            args: --linux --x64
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux display server for packaged smoke
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Type-check & compile
        run: npm run build

      - name: Build packages (no publish)
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == matrix.label
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Smoke test packaged executable
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == matrix.label
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "linux" ]; then
            xvfb-run -a npm run smoke:packaged
          else
            npm run smoke:packaged
          fi

      - name: Smoke test NSIS installer
        if: matrix.label == 'windows' && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == matrix.label)
        run: npm run smoke:installer

      - name: Upload artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == matrix.label
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-packages
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
